# Debian/Ubuntu .deb build + apt repo on GitHub Pages.
#
# Builds the omp CLI binary, packages it as a .deb for amd64 and arm64,
# attaches both to the rolling main-latest release (coexisting with
# rpm-fedora.yml and homebrew.yml — each scrubs only its own asset types),
# and updates the apt repo on gh-pages.

name: Debian apt repo

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pages: write

jobs:
  # ---------------------------------------------------------------------------
  # Build binary + package .deb, per arch.
  # ---------------------------------------------------------------------------
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            native_arch: x64
            native_variant: modern
          - arch: arm64
            runner: ubuntu-24.04-arm
            native_arch: arm64
            native_variant: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      # --- Toolchain ---
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3"

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2
        with:
          toolchain: nightly-2026-04-29

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: native-linux-${{ matrix.native_arch }}${{ matrix.native_variant && format('-{0}', matrix.native_variant) || '' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - run: bun install --frozen-lockfile

      # --- Pre-build: stats bundle + native Rust addon ---
      - name: Generate stats client bundle
        run: bun --cwd=packages/stats scripts/generate-client-bundle.ts --generate

      - name: Build native addon (Rust)
        env:
          TARGET_PLATFORM: linux
          TARGET_ARCH: ${{ matrix.native_arch }}
          TARGET_VARIANTS: ${{ matrix.native_variant }}
        run: bun --cwd=packages/natives run build

      # --- Main build: omp binary ---
      - name: Build omp binary
        run: bun --cwd=packages/coding-agent scripts/build-binary.ts

      # --- Stage deb sources ---
      - name: Stage deb sources
        run: |
          mkdir -p packaging/deb/sources
          cp packages/coding-agent/dist/omp packaging/deb/sources/omp
          cp LICENSE                        packaging/deb/sources/LICENSE
          ls -lh packaging/deb/sources/

      - name: Compute build metadata
        id: meta
        run: |
          VERSION=$(jq -r .version packages/coding-agent/package.json)
          BUILDNUM=$(date -u +%s)
          SHORTSHA=${GITHUB_SHA::7}
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "buildnum=${BUILDNUM}" >> "$GITHUB_OUTPUT"
          echo "shortsha=${SHORTSHA}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION}-0.${BUILDNUM}.git${SHORTSHA} for ${{ matrix.arch }}"

      - name: Install dpkg tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Build .deb
        env:
          DEB_VERSION: ${{ steps.meta.outputs.version }}
          DEB_BUILDNUM: ${{ steps.meta.outputs.buildnum }}
          DEB_SHORTSHA: ${{ steps.meta.outputs.shortsha }}
          DEB_ARCH: ${{ matrix.arch }}
          GH_OWNER: ${{ github.repository_owner }}
        run: bash packaging/deb/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deb-${{ matrix.arch }}
          path: packaging/deb/out/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Attach .debs to the rolling "main-latest" GitHub Release.
  # Coexists with rpm-fedora.yml (scrubs *.rpm) and homebrew.yml (scrubs omp-*).
  # ---------------------------------------------------------------------------
  publish-release:
    name: Attach .debs to rolling Release
    needs: build-deb
    runs-on: ubuntu-latest
    concurrency:
      group: deb-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download .deb artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: debs
          pattern: deb-*
          merge-multiple: true

      - name: Upsert main-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Rolling build from \`main\` @ \`${GITHUB_SHA::7}\` — $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          if gh release view main-latest >/dev/null 2>&1; then
            # Scrub only *.deb so we coexist with rpm-fedora.yml (*.rpm) and
            # homebrew.yml (omp-*). Changing _buildnum in the filename defeats
            # --clobber, so delete first.
            gh release view main-latest --json assets --jq '.assets[].name' \
              | while read -r n; do
                  case "$n" in *.deb) gh release delete-asset main-latest "$n" --yes ;; esac
                done
            gh release edit main-latest --prerelease --title "Rolling main build" --notes "${NOTES}"
          else
            gh release create main-latest --prerelease \
              --title "Rolling main build" --notes "${NOTES}" --target "${GITHUB_SHA}"
          fi
          gh release upload main-latest debs/*.deb

  # ---------------------------------------------------------------------------
  # Push apt repository tree (apt-ftparchive) to gh-pages.
  # Shares the gh-pages concurrency group with rpm-fedora.yml so the two
  # workflows serialize cleanly against the same branch.
  # ---------------------------------------------------------------------------
  publish-pages:
    name: Publish apt repo to gh-pages
    needs: build-deb
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout gh-pages (or init)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site 2>/dev/null \
          || {
            echo "gh-pages missing — initialising a fresh orphan branch"
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
            cd site
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "init gh-pages"
          }

      - name: Checkout source (for templates)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: src

      - name: Download .deb artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: new-debs
          pattern: deb-*
          merge-multiple: true

      - name: Install apt-ftparchive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils

      - name: Stage .debs and regenerate apt metadata
        run: |
          set -euo pipefail
          DEBIAN=site/debian
          POOL="$DEBIAN/pool/main/o/omp"
          mkdir -p "$POOL"

          # Accumulate rolling builds (matches rpm-fedora.yml behaviour) so
          # older revisions remain installable via `apt install omp=<ver>`.
          # `-n` is a safety net for re-runs; new buildnums never collide.
          cp -vn new-debs/*.deb "$POOL/" || true

          for arch in amd64 arm64; do
            BIN="$DEBIAN/dists/stable/main/binary-$arch"
            mkdir -p "$BIN"
            # apt-ftparchive emits Filename: paths relative to its cwd, so
            # invoke it from $DEBIAN to keep them rooted at `pool/...`.
            ( cd "$DEBIAN" && \
              apt-ftparchive --arch "$arch" packages pool > "dists/stable/main/binary-$arch/Packages" )
            gzip -9c "$BIN/Packages" > "$BIN/Packages.gz"
          done

          ( cd "$DEBIAN/dists/stable" && \
            apt-ftparchive release \
              -o APT::FTPArchive::Release::Origin="omp" \
              -o APT::FTPArchive::Release::Label="omp" \
              -o APT::FTPArchive::Release::Suite="stable" \
              -o APT::FTPArchive::Release::Codename="stable" \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="omp apt repo (unsigned, trusted=yes)" \
              . > Release )

          touch site/.nojekyll

      - name: Render apt sources files and shared index from templates
        run: |
          set -euo pipefail
          OWNER_L="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_N="${GITHUB_REPOSITORY##*/}"
          BASE_URL="https://${OWNER_L}.github.io/${REPO_N}"
          BUILD_TS="$(date -u '+%Y-%m-%d %H:%M:%SZ')"
          sed -e "s|{{BASE_URL}}|${BASE_URL}|g" \
              src/packaging/deb/omp.list.template > site/omp.list
          sed -e "s|{{BASE_URL}}|${BASE_URL}|g" \
              src/packaging/deb/omp.sources.template > site/omp.sources
          sed -e "s|{{BASE_URL}}|${BASE_URL}|g" \
              -e "s|{{OWNER}}|${GITHUB_REPOSITORY_OWNER}|g" \
              -e "s|{{BUILD_TIMESTAMP}}|${BUILD_TS}|g" \
              src/packaging/index.html.template > site/index.html
          cat site/omp.list
          cat site/omp.sources

      - name: Commit and push gh-pages
        run: |
          set -euo pipefail
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "publish apt repo @ ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
